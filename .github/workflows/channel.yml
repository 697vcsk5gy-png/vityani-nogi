name: Channel agent

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run channel agent
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TRAVELPAYOUTS_TRS: ${{ secrets.TRAVELPAYOUTS_TRS }}
          CHANNEL_BOT_TOKEN: ${{ secrets.CHANNEL_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python channel_agent.py search
      - name: Save state
        run: |
          git config user.name "channel-agent"
          git config user.email "channel-agent@users.noreply.github.com"
          git add channel_state.json
          git diff --cached --quiet && exit 0
          git commit -m "channel state update"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
